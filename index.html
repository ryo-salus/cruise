<!-- KPQ tool template -->
<div id="app">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">

<style>
#app {
  --deep:    #0B2B3C;
  --shoal:   #F2E4C4;
  --land:    #FBFAF5;
  --water:   #C8DDE6;
  --note:    #B0125E;
  --sound:   #2F6B4F;
  --grey:    #6C7B84;
  --hair:    #B9CBD4;

  font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--deep);
  background: var(--land);
  line-height: 1.55;
  max-width: 1080px;
  margin: 0 auto;
}
#app *, #app *::before, #app *::after { box-sizing: border-box; }
#app button:focus-visible, #app textarea:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; }

/* ---------- masthead ---------- */
.kpq-head {
  border-bottom: 2px solid var(--deep);
  padding: 22px 24px 14px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.kpq-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 34px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  margin: 0;
}
.kpq-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.10em;
  color: var(--grey);
  margin-top: 7px;
  text-transform: uppercase;
}
.kpq-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--grey);
  text-align: right;
  letter-spacing: 0.04em;
}
.kpq-meta b { color: var(--deep); font-weight: 600; }
.kpq-meta .kpq-warn { color: var(--note); font-weight: 600; }

/* ---------- input ---------- */
.kpq-body { padding: 22px 24px 40px; }
.kpq-drop {
  border: 1.5px dashed var(--hair);
  background: #fff;
  border-radius: 3px;
  transition: border-color .15s, background .15s;
}
.kpq-drop.kpq-over { border-color: var(--note); background: #fff6fa; }
.kpq-ta {
  width: 100%;
  min-height: 190px;
  border: 0;
  background: transparent;
  padding: 15px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--deep);
  resize: vertical;
}
.kpq-ta::placeholder { color: #9BAEB8; }
.kpq-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  border-top: 1px solid #E6EDF0;
  padding: 9px 14px;
  flex-wrap: wrap;
}
.kpq-file {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--grey);
  letter-spacing: 0.03em;
  flex: 1;
  min-width: 140px;
}
.kpq-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  background: var(--deep);
  color: var(--land);
  border: 0;
  border-radius: 2px;
  padding: 9px 20px;
  cursor: pointer;
}
.kpq-btn:hover { background: #143c52; }
.kpq-btn:disabled { background: #A9BAC3; cursor: default; }
.kpq-btn.kpq-ghost {
  background: transparent;
  color: var(--deep);
  border: 1px solid var(--hair);
}
.kpq-btn.kpq-ghost:hover { background: var(--water); }

/* ---------- soundings bar (signature) ---------- */
.kpq-tally { margin: 26px 0 6px; display: none; }
.kpq-tally.kpq-on { display: block; }
.kpq-sound-row {
  display: flex;
  height: 9px;
  border: 1px solid var(--deep);
  overflow: hidden;
}
.kpq-sound-row span { display: block; height: 100%; }
.kpq-legend {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 9px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--grey);
}
.kpq-legend i { font-style: normal; display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; }
.kpq-legend b { font-weight: 600; color: var(--deep); }

.kpq-status { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--grey); margin-top: 14px; letter-spacing: 0.04em; }
.kpq-err { color: var(--note); }

/* ---------- results ---------- */
.kpq-results { margin-top: 22px; }
.kpq-row {
  display: grid;
  grid-template-columns: 4px 1fr;
  gap: 0 16px;
  border-bottom: 1px solid #E6EDF0;
  padding: 0;
}
.kpq-tick { background: var(--sound); }
.kpq-inner { padding: 14px 0 15px; }
.kpq-q {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0 0 5px;
}
.kpq-a { font-size: 14.5px; margin: 0 0 7px; white-space: pre-wrap; }
.kpq-a.kpq-empty { color: var(--note); font-style: italic; }
.kpq-tags {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--grey);
  text-transform: uppercase;
}
.kpq-flag { color: var(--note); font-weight: 600; }
.kpq-key { color: #8A9BA4; }

.kpq-foot { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
.kpq-out {
  width: 100%;
  min-height: 150px;
  margin-top: 14px;
  border: 1px solid var(--hair);
  border-radius: 3px;
  padding: 12px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  display: none;
  background: #fff;
  color: var(--deep);
}
.kpq-out.kpq-on { display: block; }

@media (max-width: 620px) {
  .kpq-title { font-size: 26px; }
  .kpq-meta { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  #app * { transition: none !important; }
}
</style>

<div class="kpq-head">
  <div>
    <h1 class="kpq-title">Kagoshima &mdash; Port Questionnaire</h1>
    <div class="kpq-sub">Answers drawn from the ledger only &middot; nothing generated</div>
  </div>
  <div class="kpq-meta">
    <div>Ledger <b id="kpqCount">0</b> entries</div>
    <div class="kpq-warn" id="kpqConf">0 unresolved conflicts</div>
  </div>
</div>

<div class="kpq-body">

  <div class="kpq-drop" id="kpqDrop">
    <textarea class="kpq-ta" id="kpqIn" placeholder="Paste the questionnaire here, or drop a .docx / .xlsx / .txt file anywhere in this box."></textarea>
    <div class="kpq-bar">
      <span class="kpq-file" id="kpqFile">No file loaded</span>
      <button class="kpq-btn kpq-ghost" id="kpqClear">Clear</button>
      <button class="kpq-btn" id="kpqRun" disabled>Draft answers</button>
    </div>
  </div>

  <div class="kpq-status" id="kpqStatus"></div>

  <div class="kpq-tally" id="kpqTally">
    <div class="kpq-sound-row" id="kpqSoundRow"></div>
    <div class="kpq-legend" id="kpqLegend"></div>
  </div>

  <div class="kpq-results" id="kpqResults"></div>

  <div class="kpq-foot" id="kpqFoot" style="display:none">
    <button class="kpq-btn kpq-ghost" id="kpqCopy">Copy all answers</button>
    <button class="kpq-btn kpq-ghost" id="kpqCopyFlag">Copy items needing attention</button>
    <button class="kpq-btn kpq-ghost" id="kpqCopyNew">Draft ledger entries for gaps</button>
  </div>
  <textarea class="kpq-out" id="kpqOut" readonly></textarea>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);

  let facts = [], conflicts = [], compact = [], conflictText = '', SYSTEM = '';

  fetch('./port_facts.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(led => {
      facts = led.facts || [];
      conflicts = led.conflicts_requiring_resolution || [];
      $('kpqCount').textContent = facts.length;
      $('kpqConf').textContent = conflicts.length + ' unresolved conflicts';
      buildPrompt();
      $('kpqRun').disabled = false;
    })
    .catch(() => {
      $('kpqStatus').className = 'kpq-status kpq-err';
      $('kpqStatus').textContent = 'port_facts.json could not be loaded. Check that it sits next to index.html.';
    });


  const STATUS_COLOUR = {
    confirmed:     '#2F6B4F',
    single_source: '#7FA08C',
    conflict:      '#B0125E',
    placeholder:   '#D9A441',
    unmatched:     '#6C7B84'
  };
  const STATUS_LABEL = {
    confirmed:     'Confirmed',
    single_source: 'One source',
    conflict:      'Conflict',
    placeholder:   'Fill in per call',
    unmatched:     'Not in ledger'
  };

  let results = [];

  /* ---------- file handling ---------- */
  const drop = $('kpqDrop');
  ['dragenter', 'dragover'].forEach(e =>
    drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('kpq-over'); }));
  ['dragleave', 'drop'].forEach(e =>
    drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('kpq-over'); }));

  drop.addEventListener('drop', ev => {
    const file = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (file) readFile(file);
  });

  function readFile(file) {
    const name = file.name.toLowerCase();
    $('kpqFile').textContent = 'Reading ' + file.name + '…';
    const reader = new FileReader();

    if (name.endsWith('.docx')) {
      reader.onload = e => {
        mammoth.convertToHtml({ arrayBuffer: e.target.result })
          .then(r => {
            const div = document.createElement('div');
            div.innerHTML = r.value;
            div.querySelectorAll('td, th').forEach(c => c.append(' | '));
            div.querySelectorAll('tr, p, li').forEach(c => c.append('\n'));
            $('kpqIn').value = div.textContent.replace(/\n{3,}/g, '\n\n').trim();
            $('kpqFile').textContent = file.name;
          })
          .catch(() => { $('kpqFile').textContent = 'Could not read ' + file.name + ' — paste the text instead.'; });
      };
      reader.readAsArrayBuffer(file);

    } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      reader.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const out = wb.SheetNames.map(n =>
            '## ' + n + '\n' + XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })
          ).join('\n\n');
          $('kpqIn').value = out.trim();
          $('kpqFile').textContent = file.name;
        } catch (err) {
          $('kpqFile').textContent = 'Could not read ' + file.name + ' — paste the text instead.';
        }
      };
      reader.readAsArrayBuffer(file);

    } else {
      reader.onload = e => {
        $('kpqIn').value = e.target.result;
        $('kpqFile').textContent = file.name;
      };
      reader.readAsText(file);
    }
  }

  /* ---------- chunking ---------- */
  function chunk(text, size) {
    const lines = text.split('\n');
    const out = [];
    let buf = '';
    for (const line of lines) {
      if (buf.length + line.length > size && buf.trim()) { out.push(buf); buf = ''; }
      buf += line + '\n';
    }
    if (buf.trim()) out.push(buf);
    return out;
  }

  /* ---------- API ---------- */
  function buildPrompt() {
    // Compact ledger for the prompt — key, aliases, value, status only.
    compact = facts.map(f => {
      const o = { k: f.key, v: f.value, s: f.status };
      if (f.unit) o.u = f.unit;
      if (f.aliases && f.aliases.length) o.a = f.aliases;
      if (f.note) o.n = f.note;
      return o;
    });
    conflictText = conflicts.map(c =>
      c.key + ' :: ' + c.values.map(v => v.value + ' (' + v.source + ')').join('  |  ')
    ).join('\n');

    SYSTEM = [
      'You are helping a port agent in Kagoshima, Japan answer a cruise line port questionnaire.',
      '',
      'LEDGER — the ONLY permitted source of facts:',
      JSON.stringify(compact),
      '',
      'UNRESOLVED CONFLICTS in the ledger:',
      conflictText,
      '',
      'RULES:',
      '1. Never invent, estimate, infer or round any fact. Every figure must come from the ledger verbatim.',
      '2. Match each question to a ledger key using its aliases and meaning, not its exact wording.',
      '3. The ledger currently describes Marine Port Kagoshima No.1 Wharf only. If a question concerns a different berth, set status "unmatched" — never reuse No.1 Wharf figures for another berth.',
      '4. If the matched key appears in UNRESOLVED CONFLICTS, set status "conflict" and write all conflicting values with their sources in answer_en.',
      '5. If the matched key has status "placeholder", set status "placeholder" and write a bracketed prompt such as "[ETA — confirm per call]".',
      '6. If no key matches, set status "unmatched" and leave answer_en as an empty string. Never guess.',
      '7. For yes/no or checkbox rows, start answer_en with exactly "Yes" or "No", then add the ledger qualifier if one exists.',
      '8. Write in the plain factual English a port agent uses. No pleasantries.',
      '9. Skip headings, section titles and instructions that are not questions.',
      '',
      'Return ONLY a JSON array, no markdown fences and no preamble:',
      '[{"question":"...","key":"...","answer_en":"...","status":"confirmed|single_source|conflict|placeholder|unmatched"}]'
    ].join('\n');
  }

  async function callAPI(part) {
    const res = await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM, section: part })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

    const text = (data.text || '').replace(/```json|```/g, '').trim();
    const start = text.indexOf('[');
    const end = text.lastIndexOf(']');
    if (start === -1 || end === -1) return [];
    return JSON.parse(text.slice(start, end + 1));
  }

  /* ---------- render ---------- */
  function render() {
    const box = $('kpqResults');
    box.innerHTML = '';
    results.forEach(r => {
      const colour = STATUS_COLOUR[r.status] || STATUS_COLOUR.unmatched;
      const row = document.createElement('div');
      row.className = 'kpq-row';

      const tick = document.createElement('div');
      tick.className = 'kpq-tick';
      tick.style.background = colour;

      const inner = document.createElement('div');
      inner.className = 'kpq-inner';

      const q = document.createElement('p');
      q.className = 'kpq-q';
      q.textContent = r.question;

      const a = document.createElement('p');
      a.className = 'kpq-a';
      if (r.answer_en && r.answer_en.trim()) {
        a.textContent = r.answer_en;
      } else {
        a.className += ' kpq-empty';
        a.textContent = 'No ledger entry covers this — answer by hand, then add it to the ledger.';
      }

      const tags = document.createElement('div');
      tags.className = 'kpq-tags';
      const flagged = r.status === 'conflict' || r.status === 'placeholder' || r.status === 'unmatched';
      tags.innerHTML =
        '<span class="' + (flagged ? 'kpq-flag' : '') + '">' + (STATUS_LABEL[r.status] || r.status) + '</span>' +
        (r.key ? ' <span class="kpq-key">&middot; ' + r.key + '</span>' : '');

      inner.append(q, a, tags);
      row.append(tick, inner);
      box.append(row);
    });

    // soundings bar
    const counts = {};
    results.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
    const bar = $('kpqSoundRow');
    const leg = $('kpqLegend');
    bar.innerHTML = '';
    leg.innerHTML = '';
    Object.keys(STATUS_COLOUR).forEach(s => {
      const n = counts[s] || 0;
      if (!n) return;
      const seg = document.createElement('span');
      seg.style.background = STATUS_COLOUR[s];
      seg.style.flex = n;
      bar.append(seg);
      const item = document.createElement('div');
      item.innerHTML = '<i style="background:' + STATUS_COLOUR[s] + '"></i>' +
                       STATUS_LABEL[s] + ' <b>' + n + '</b>';
      leg.append(item);
    });
    $('kpqTally').classList.toggle('kpq-on', results.length > 0);
    $('kpqFoot').style.display = results.length ? 'flex' : 'none';
  }

  /* ---------- run ---------- */
  $('kpqRun').addEventListener('click', async () => {
    const text = $('kpqIn').value.trim();
    if (!text) { $('kpqStatus').textContent = 'Paste a questionnaire or drop a file first.'; return; }

    const parts = chunk(text, 6000);
    results = [];
    render();
    $('kpqRun').disabled = true;
    $('kpqOut').classList.remove('kpq-on');
    $('kpqStatus').className = 'kpq-status';

    for (let i = 0; i < parts.length; i++) {
      $('kpqStatus').textContent = 'Section ' + (i + 1) + ' of ' + parts.length + ' — ' + results.length + ' questions answered so far';
      try {
        const rows = await callAPI(parts[i]);
        results = results.concat(rows);
        render();
      } catch (err) {
        $('kpqStatus').className = 'kpq-status kpq-err';
        $('kpqStatus').textContent = 'Section ' + (i + 1) + ' failed. The other sections are still listed below — run it again to retry.';
      }
    }

    $('kpqRun').disabled = false;
    const flagged = results.filter(r => r.status !== 'confirmed' && r.status !== 'single_source').length;
    $('kpqStatus').className = 'kpq-status';
    $('kpqStatus').textContent = results.length + ' questions answered · ' + flagged + ' need your attention before sending';
  });

  $('kpqClear').addEventListener('click', () => {
    $('kpqIn').value = '';
    $('kpqFile').textContent = 'No file loaded';
    results = [];
    render();
    $('kpqStatus').textContent = '';
    $('kpqOut').classList.remove('kpq-on');
  });

  function toText(list) {
    return list.map(r =>
      r.question + '\n' + (r.answer_en && r.answer_en.trim() ? r.answer_en : '[ANSWER BY HAND]') +
      '   <' + (STATUS_LABEL[r.status] || r.status) + '>'
    ).join('\n\n');
  }
  $('kpqCopy').addEventListener('click', () => {
    $('kpqOut').value = toText(results);
    $('kpqOut').classList.add('kpq-on');
    $('kpqOut').select();
  });
  $('kpqCopyFlag').addEventListener('click', () => {
    $('kpqOut').value = toText(results.filter(r => r.status !== 'confirmed' && r.status !== 'single_source'));
    $('kpqOut').classList.add('kpq-on');
    $('kpqOut').select();
  });

  // Every gap is a ledger entry waiting to be written. Emit it ready to paste.
  $('kpqCopyNew').addEventListener('click', () => {
    const gaps = results.filter(r => r.status === 'unmatched');
    if (!gaps.length) {
      $('kpqOut').value = 'No gaps in this questionnaire — the ledger covered every question.';
    } else {
      $('kpqOut').value =
        '// Fill in each value, then paste into the "facts" array of port_facts.json\n' +
        JSON.stringify(gaps.map(r => ({
          key: '',
          value: null,
          aliases: [r.question],
          status: 'single_source',
          volatility: 'stable'
        })), null, 2);
    }
    $('kpqOut').classList.add('kpq-on');
    $('kpqOut').select();
  });
})();
</script>
